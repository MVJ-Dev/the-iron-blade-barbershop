<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrito de compras de The Iron Blade Barbershop.">
  <meta name="author" content="Nelson Carrasco - Mathias Von Jentschyk">
  <title>The Iron Blade | Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-iron fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">IRON<span>BLADE</span></a>
        <button class="navbar-toggler text-light border-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Reservas</a></li>
            <li class="nav-item d-none" id="nav-admin"><a class="nav-link" href="admin.html">Mantenedor</a></li>
            <li class="nav-item d-none" id="nav-carrito"><a class="nav-link active" href="carrito.html"><i class="bi bi-cart3"></i> Carrito <span class="contador-carrito" id="contador-carrito">0</span></a></li>
            <li class="nav-item d-none" id="nav-usuario"><span class="badge-rol" id="nombre-usuario"></span></li>
            <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html"><i class="bi bi-person"></i> Ingresar</a></li>
            <li class="nav-item d-none" id="nav-cerrar"><a class="nav-link" href="#"><i class="bi bi-box-arrow-right"></i> Salir</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="seccion seccion-oscura" style="margin-top:56px; min-height:80vh;">
      <div class="container">
        <h1 class="titulo-seccion">Mi Carrito</h1>
        <hr class="divisor-dorado">

        <div class="row g-4">
          <div class="col-lg-8">
            <div id="lista-carrito"></div>
            <div id="carrito-vacio" class="text-center py-5 d-none">
              <i class="bi bi-cart-x" style="font-size:3rem; color:var(--color-dorado);"></i>
              <p class="mt-3 text-secondary">Tu carrito esta vacio.</p>
              <a href="catalogo.html" class="btn btn-iron">Ir al catalogo</a>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="resumen-carrito" id="resumen-carrito">
              <h3 class="h5 texto-dorado">Resumen del pedido</h3>
              <hr style="border-color:#444;">
              <div class="d-flex justify-content-between mb-2">
                <span>Items:</span><span id="resumen-cantidad">0</span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span class="h5">Total:</span><span class="precio" id="resumen-total">$0</span>
              </div>
              <button class="btn btn-iron w-100 mb-2" id="btn-pagar">Finalizar compra</button>
              <button class="btn btn-iron-outline w-100" id="btn-vaciar">Vaciar carrito</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer-iron">
    <div class="container">
      <div class="footer-copyright">
        <p class="mb-0">&copy; 2025 The Iron Blade Barbershop. Proyecto academico DSY1104 - Nelson Carrasco &amp; Mathias Von Jentschyk.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
