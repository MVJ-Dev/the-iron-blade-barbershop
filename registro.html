<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en The Iron Blade Barbershop.">
  <meta name="author" content="Nelson Carrasco - Mathias Von Jentschyk">
  <title>The Iron Blade | Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-iron fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">IRON<span>BLADE</span></a>
        <button class="navbar-toggler text-light border-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Reservas</a></li>
            <li class="nav-item d-none" id="nav-admin"><a class="nav-link" href="admin.html">Mantenedor</a></li>
            <li class="nav-item d-none" id="nav-carrito"><a class="nav-link" href="carrito.html"><i class="bi bi-cart3"></i> Carrito</a></li>
            <li class="nav-item d-none" id="nav-usuario"><span class="badge-rol" id="nombre-usuario"></span></li>
            <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html"><i class="bi bi-person"></i> Ingresar</a></li>
            <li class="nav-item d-none" id="nav-cerrar"><a class="nav-link" href="#"><i class="bi bi-box-arrow-right"></i> Salir</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="seccion seccion-oscura" style="margin-top:56px; min-height:90vh;">
      <div class="container">
        <h1 class="titulo-seccion">Crear Cuenta</h1>
        <hr class="divisor-dorado">

        <form class="form-iron" id="formRegistro" novalidate>
          <div id="alertaRegistro" class="alert alerta-iron d-none" role="alert"></div>

          <div class="mb-3">
            <label for="nombre">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Juan Perez" autocomplete="name">
            <span class="mensaje-error" id="error-nombre"></span>
          </div>

          <div class="mb-3">
            <label for="email">Correo electronico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="nombre@correo.cl" autocomplete="email">
            <span class="mensaje-error" id="error-email"></span>
          </div>

          <div class="mb-3">
            <label for="password">Contrasena</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Minimo 6 caracteres, letras y numeros" autocomplete="new-password">
            <span class="mensaje-error" id="error-password"></span>
          </div>

          <div class="mb-3">
            <label for="confirmacion">Repetir contrasena</label>
            <input type="password" class="form-control" id="confirmacion" name="confirmacion" placeholder="Repite tu contrasena" autocomplete="new-password">
            <span class="mensaje-error" id="error-confirmacion"></span>
          </div>

          <button type="submit" class="btn btn-iron w-100">Registrarme</button>

          <p class="text-center text-secondary mt-3 mb-0">
            Ya tienes cuenta? <a href="login.html">Inicia sesion</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer-iron">
    <div class="container">
      <div class="footer-copyright">
        <p class="mb-0">&copy; 2025 The Iron Blade Barbershop. Proyecto academico DSY1104 - Nelson Carrasco &amp; Mathias Von Jentschyk.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validaciones.js"></script>
  <script>

    document.getElementById('nombre').addEventListener('blur', function () { validarNombre('nombre'); });
    document.getElementById('email').addEventListener('blur', function () { validarEmail('email'); });
    document.getElementById('password').addEventListener('blur', function () { validarPassword('password'); });
    document.getElementById('confirmacion').addEventListener('blur', function () { validarConfirmacion('password', 'confirmacion'); });

    document.getElementById('formRegistro').addEventListener('submit', function (e) {
      e.preventDefault();

      const okNombre = validarNombre('nombre');
      const okEmail  = validarEmail('email');
      const okPass   = validarPassword('password');
      const okConf   = validarConfirmacion('password', 'confirmacion');

      if (!(okNombre && okEmail && okPass && okConf)) return;

      const resultado = registrarUsuario(
        document.getElementById('nombre').value.trim(),
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );

      const alerta = document.getElementById('alertaRegistro');
      alerta.classList.remove('d-none', 'alert-success', 'alert-danger');

      if (resultado.ok) {
        alerta.classList.add('alert-success');
        alerta.textContent = 'Cuenta creada con exito. Redirigiendo al login...';
        document.getElementById('formRegistro').reset();
        setTimeout(function () { window.location.href = 'login.html'; }, 1200);
      } else {
        alerta.classList.add('alert-danger');
        alerta.textContent = resultado.mensaje;
      }
    });
  </script>
</body>
</html>
